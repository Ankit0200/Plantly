# Nutrient recommendations (lb per 1000 sq ft) by soil test level and crop.
#
# Source: Southeastern U.S. 2024 Vegetable Crop Handbook (Southeastern Vegetable Extension
# Workers, incl. UGA), Table 2 "Total recommended" rows, bareground production unless noted.
# The handbook gives lb/acre for soil test Low / Medium / High / Very High; values here are
# lb/acre / 43.56, rounded to 2 decimals. Each row keeps the lb/acre numbers in a comment.
#
# Levels: the handbook has 4 ratings, the engine has 5. very_low and low both use the Low rate.
# Ratings must come from a Mehlich-1 lab scale (UGA): see soil_test_levels.yaml.
# Some crops keep a small P or K rate at Very High (starter/maintenance); that is in the table.
#
# N is NOT in this file. The handbook's N range per crop is noted on each P2O5 row so it can
# be moved into crops.yaml (n_min / n_max). The handbook says N rates should follow local
# recommendations.

# --- P2O5 recommendations ---

- id: NUT-P2O5-tomato
  nutrient: P2O5
  crop: tomato
  # Table 2 row: Tomato, bareground, sandy loams and loamy sands. lb/acre L/M/H/VH = 200/150/100/0
  # N range for this crop: 80-90 lb/acre
  # Note: Loam/clay bareground row: K2O 250/150/100/0, N 75-80. Plasticulture: N 130-210, K2O 420/345/275/50.
  lb_per_1000sqft:
    very_low: 4.59
    low: 4.59
    medium: 3.44
    high: 2.3
    very_high: 0.0
  source: SRC-SE-VEG-HANDBOOK
  verified: false

