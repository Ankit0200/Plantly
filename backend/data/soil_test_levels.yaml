# Soil test level cutoffs (ppm, Mehlich-1) used to pick the row in nutrient_recs.yaml.
#
# UGA uses Mehlich-1 and rates P and K Low / Medium / High / Very High (UGA Circular 1322).
# Cutoffs below are UGA's Coastal Plain ranges from the UGA soil test crop sheets (lb/acre),
# divided by 2 to get ppm:
#   P (lb/acre): Low 0-30, Medium 31-60, High 61-100, Very High over 100
#   K (lb/acre): Low 0-60, Medium 61-150, High 151-250, Very High over 250
# Piedmont soils use different ranges:
#   P (lb/acre): Low 0-20, Medium 21-40, High 41-75, Very High over 75
#   K (lb/acre): Low 0-100, Medium 101-200, High 201-350, Very High over 350
# These ranges were read from the crop-sheet document's field-crop pages; check one
# vegetable sheet (e.g. code 147, cabbage) before marking verified.
#
# The engine has 5 levels and UGA has 4: very_low is unused (bound 0) and gets the Low rate.
# A value is in a level when it is at or below that level's upper bound.

- id: STL-P
  nutrient: P
  extractant: Mehlich-1
  region: coastal_plain
  upper_bounds_ppm:
    very_low: 0
    low: 15        # 30 lb/acre
    medium: 30     # 60 lb/acre
    high: 50       # 100 lb/acre
  source: SRC-UGA-CROPSHEETS
  verified: false

- id: STL-K
  nutrient: K
  extractant: Mehlich-1
  region: coastal_plain
  upper_bounds_ppm:
    very_low: 0
    low: 30        # 60 lb/acre
    medium: 75     # 150 lb/acre
    high: 125      # 250 lb/acre
  source: SRC-UGA-CROPSHEETS
  verified: false