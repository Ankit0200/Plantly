# Crop definitions for Soil-Smart Planner.
#
# family:    botanical family (Clemson HGIC 1330 crop rotation family list).
# n_demand:  feeder group from UGA C963 "Vegetable Gardening in Georgia"
#            (heavy, medium, light). Legumes are "fixer" in this engine.
#            Broccoli and garlic are not listed in C963; see comments on those rows.
# target_ph: Clemson HGIC "Fertilizing Vegetables": optimum 6.0-6.5 for most vegetables;
#            the top of the range (6.5) is used as the liming target. Exceptions noted per row.
# N split fields (replacing single n_need_lb_per_1000sqft):
#   n_min_lb_per_1000sqft / n_max_lb_per_1000sqft: range converted from lb/acre / 43.56
#   preplant_n_fraction: fraction of total N applied at planting (0 to 1)
#   sidedress_count: number of sidedress applications after planting
# N rates sourced from UGA Commercial Vegetable Production recommendations per crop.
# LEGUMES: 0 lb N is a planner assumption (they fix their own N).

- id: tomato
  name: Tomato
  family: nightshade
  n_demand: heavy
  target_ph: 6.5
  n_min_lb_per_1000sqft: 3.44
  n_max_lb_per_1000sqft: 4.59
  preplant_n_fraction: 0.33
  sidedress_count: 3
  source: SRC-UGA-COMMERCIAL
  plant_seasons: [spring, summer]
  type: warm
  verified: false

